name: Build rhodep kernel + KernelSU

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Defconfig name (check arch/arm64/configs/)"
        default: "vendor/holi-qgki_defconfig"
      ksu_setup:
        description: "KernelSU-Next setup command suffix"
        default: "next"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source (this fork)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi bc bison flex libssl-dev libelf-dev \
            python3 zip curl git cpio

      - name: Add KernelSU-Next (non-GKI)
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s ${{ github.event.inputs.ksu_setup }}

      - name: Configure
        run: |
          export ARCH=arm64
          make O=out LLVM=1 LLVM_IAS=1 ${{ github.event.inputs.defconfig }}
          scripts/config --file out/.config \
            -e KSU -e KPROBES -e HAVE_KPROBES -e KPROBE_EVENTS -e OVERLAY_FS
          make O=out LLVM=1 LLVM_IAS=1 olddefconfig

      - name: Build
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          if ! make -j$(nproc) O=out LLVM=1 LLVM_IAS=1 Image > build.log 2>&1; then
            echo "=== BUILD FAILED: error lines ==="
            grep -nE "error:|Error [0-9]|undefined reference|No rule to make" build.log | head -40
            echo "=== re-running single-threaded to show first error ==="
            make -j1 O=out LLVM=1 LLVM_IAS=1 Image 2>&1 | tail -n 40
            exit 1
          fi
          ls -lh ou
