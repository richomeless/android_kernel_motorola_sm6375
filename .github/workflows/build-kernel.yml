name: Build rhodep kernel + KernelSU

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Defconfig name (check arch/arm64/configs/)"
        default: "vendor/holi-qgki_defconfig"
      ksu_tag:
        description: "KernelSU tag (last non-GKI version)"
        default: "v0.9.5"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source (this fork)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi bc bison flex libssl-dev libelf-dev \
            python3 zip curl git cpio

      - name: Add KernelSU (official, non-GKI tag)
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s ${{ github.event.inputs.ksu_tag }}

      - name: Configure
        run: |
          export ARCH=arm64
          make O=out LLVM=1 LLVM_IAS=1 ${{ github.event.inputs.defconfig }}
          scripts/config --file out/.config \
            -e KSU -e KPROBES -e HAVE_KPROBES -e KPROBE_EVENTS -e OVERLAY_FS
          make O=out LLVM=1 LLVM_IAS=1 olddefconfig

      - name: Build
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          if ! make -k -j$(nproc) O=out LLVM=1 LLVM_IAS=1 Image > build.log 2>&1; then
            echo "=== BUILD FAILED: all error lines ==="
            grep -nE "error:|undefined reference|No rule to make" build.log | head -60
            exit 1
          fi
          ls -lh out/arch/arm64/boot/

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          cp out/arch/arm64/boot/Image ak3/Image
          sed -i 's/do.devicecheck=1/do.devicecheck=0/' ak3/anykernel.sh
          sed -i 's|^BLOCK=.*|BLOCK=boot;|' ak3/anykernel.sh
          sed -i 's|^IS_SLOT_DEVICE=.*|IS_SLOT_DEVICE=auto;|' ak3/anykernel.sh
          cd ak3 && zip -r9 ../rhodep-ksu-kernel.zip . -x ".git*" "README.md"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rhodep-ksu-kernel
          path: |
            rhodep-ksu-kernel.zip
            build.log
