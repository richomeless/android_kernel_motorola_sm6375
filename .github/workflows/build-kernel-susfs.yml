name: Build rhodep kernel + KernelSU + SUSFS

on:
  workflow_dispatch:

env:
  COMMIT: c8bc4b74db62
  REL: 5.4.302-moto-gc8bc4b74db62
  KSU_TAG: v0.9.5

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Checkout kernel source (full history, no blobs)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Keep phone config safe
        run: |
          test -f config.gz || { echo "config.gz is missing"; exit 1; }
          cp config.gz "$RUNNER_TEMP/config.gz"

      - name: Pin source to the phone's kernel commit
        run: |
          git checkout -q "$COMMIT"
          git log -1 --format='source at %H'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            bc bison flex libssl-dev libelf-dev python3 zip curl git cpio lz4 zstd xz-utils

      - name: Get Android clang r563880c
        run: |
          mkdir -p "$HOME/clang" && cd "$HOME/clang"
          ok=0
          for ref in refs/heads/main refs/heads/master refs/heads/android16-release refs/heads/android16-qpr2-release; do
            url="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${ref}/clang-r563880c.tar.gz"
            if curl -fL --retry 2 -o c.tgz "$url" && tar -tzf c.tgz > /dev/null 2>&1; then
              echo "toolchain from $ref"; ok=1; break
            fi
          done
          [ "$ok" = 1 ] || { echo "Could not download clang-r563880c"; exit 1; }
          tar -xzf c.tgz
          ./bin/clang --version | head -1

      - name: Add KernelSU (official, non-GKI tag)
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s "$KSU_TAG"

      - name: Apply SUSFS patches and fix rejects
        run: |
          URL=https://gitlab.com/simonpunk/susfs4ksu.git
          BR=$(git ls-remote --heads $URL | sed 's|.*refs/heads/||' | grep -E '5\.4' | head -1)
          echo "susfs branch: $BR"
          [ -n "$BR" ] || { echo "no 5.4 branch"; exit 1; }
          git clone --depth=1 -b "$BR" $URL "$RUNNER_TEMP/susfs"
          S="$RUNNER_TEMP/susfs/kernel_patches"

          cp "$S"/KernelSU/10_enable_susfs_for_ksu.patch KernelSU/
          ( cd KernelSU && patch -p1 --no-backup-if-mismatch < 10_enable_susfs_for_ksu.patch || true )

          cp "$S"/50_add_susfs_in_kernel-*.patch .
          patch -p1 --no-backup-if-mismatch < 50_add_susfs_in_kernel-*.patch || true

          cp -rv "$S"/fs/. fs/ || echo "no fs dir in patches"
          cp -rv "$S"/include/linux/. include/linux/ || echo "no include dir in patches"

          python3 - <<'PY'
          import os

          # 1) selinux.c: re-insert the rejected block
          rej = 'KernelSU/kernel/selinux/selinux.c.rej'
          if os.path.exists(rej):
              added = [l[1:] for l in open(rej).read().splitlines()
                       if l.startswith('+') and not l.startswith('+++')]
              block = '\n'.join(added) + '\n\n'
              p = 'KernelSU/kernel/selinux/selinux.c'
              s = open(p).read()
              m = s.find('#define DEVPTS_DOMAIN')
              s = s[:m] + block + s[m:] if m >= 0 else s + '\n' + block
              open(p, 'w').write(s)
              os.remove(rej)
              print('selinux.c fixed')

          # 2) task_mmu.c include
          p = 'fs/proc/task_mmu.c'
          s = open(p).read()
          if 'susfs_def.h' not in s:
              k = '#include <linux/pkeys.h>\n'
              assert k in s, 'pkeys.h anchor missing'
              s = s.replace(k, k + '#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n#include <linux/susfs_def.h>\n#endif\n', 1)
              open(p, 'w').write(s)
              print('task_mmu.c fixed')
          if os.path.exists(p + '.rej'):
              os.remove(p + '.rej')

          # 3) mount.h KABI field
          p = 'include/linux/mount.h'
          s = open(p).read()
          if 'susfs_mnt_id_backup' not in s:
              i = s.find('struct vfsmount {')
              k = 'ANDROID_KABI_RESERVE(4);'
              j = s.find(k, i)
              assert i >= 0 and j >= 0, 'vfsmount anchor missing'
              new = '#ifdef CONFIG_KSU_SUSFS\n\tANDROID_KABI_USE(4, u64 susfs_mnt_id_backup);\n#else\n\tANDROID_KABI_RESERVE(4);\n#endif'
              s = s[:j] + new + s[j + len(k):]
              open(p, 'w').write(s)
              print('mount.h fixed')
          if os.path.exists(p + '.rej'):
              os.remove(p + '.rej')
          PY

          echo "=== leftover rejects ==="
          find . -name '*.rej' || true

      - name: Patch KernelSU symbol names
        run: |
          if grep -q "strncpy_from_user_nofault" include/linux/uaccess.h; then
            grep -rl "strncpy_from_unsafe_user" KernelSU | xargs -r sed -i 's/strncpy_from_unsafe_user/strncpy_from_user_nofault/g'
          fi

      - name: Configure and check release string
        run: |
          export PATH="$HOME/clang/bin:$PATH"
          export ARCH=arm64
          export LOCALVERSION=""
          mkdir -p out
          zcat "$RUNNER_TEMP/config.gz" > out/.config
          scripts/config --file out/.config -e KSU -e KSU_SUSFS \
            -d KSU_SUSFS_SUS_SU -d KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            -d LOCALVERSION_AUTO --set-str LOCALVERSION "-moto-g$COMMIT"
          make O=out LLVM=1 LLVM_IAS=1 olddefconfig
          RELNOW=$(make -s O=out LLVM=1 LLVM_IAS=1 kernelrelease | tail -1)
          echo "kernel release: $RELNOW"
          [ "$RELNOW" = "$REL" ] || { echo "RELEASE MISMATCH, expected $REL"; exit 1; }
          grep -E "^CONFIG_(KSU|KPROBES|LTO_CLANG|CFI_CLANG)" out/.config

      - name: Build
        run: |
          export PATH="$HOME/clang/bin:$PATH"
          export ARCH=arm64
          export LOCALVERSION=""
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          if ! make -k -j$(nproc) O=out LLVM=1 LLVM_IAS=1 Image > build.log 2>&1; then
            echo "=== BUILD FAILED: error lines ==="
            grep -nE "error:|undefined (reference|symbol)|No rule to make" build.log | head -60
            exit 1
          fi
          ls -lh out/arch/arm64/boot/
          cat out/include/config/kernel.release

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          cp out/arch/arm64/boot/Image ak3/Image
          sed -i 's/do.devicecheck=1/do.devicecheck=0/' ak3/anykernel.sh
          sed -i 's|^BLOCK=.*|BLOCK=boot;|' ak3/anykernel.sh
          sed -i 's|^IS_SLOT_DEVICE=.*|IS_SLOT_DEVICE=auto;|' ak3/anykernel.sh
          cd ak3 && zip -r9 ../rhodep-ksu-susfs-kernel.zip . -x ".git*" "README.md"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rhodep-ksu-susfs-kernel
          path: |
            rhodep-ksu-susfs-kernel.zip
            build.log
